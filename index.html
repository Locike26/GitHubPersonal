<!DOCTYPE html>
<html>
<head>
    <title>Question</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
        }
        button {
            margin: 20px;
            padding: 10px 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div style="position: fixed; top: 5px; left: 5px; font-family: 'Times New Roman', serif; font-size: 11px; color: #333;">ElbaszottBundáskenyér.exe</div>
    <h2 id="question">Kijössz decemberben?</h2>
    <button onclick="yesClicked()">Igen</button>
    <button onclick="noClicked()">Nem</button>

    <div id="message-layer" style="position: relative; width: 100%; height: 300px; margin-top: 20px;"></div>

    <script>
        function yesClicked() {
            const question = document.getElementById("question");
            question.innerText = "HURRAY";
            question.style.fontFamily = "Georgia, serif";
            question.style.color = "#6D28D9";
            question.style.fontSize = "64px";
            question.style.fontWeight = "bold";
            question.style.textAlign = "center";
            question.style.display = "block";
            question.style.textShadow = "0 0 12px #C084FC, 0 0 24px #C084FC, 0 0 36px #8B5CF6";
            question.style.margin = "40px auto";
            document.getElementById("message-layer").innerHTML = "";
        }

        function noClicked() {
            const layer = document.getElementById("message-layer");
            const msg = document.createElement("div");

            const x = Math.random() * (window.innerWidth - 100);
            const y = 10 + Math.random() * 450;

            msg.textContent = "Lécci";
            msg.style.position = "absolute";
            msg.style.left = x + "px";
            msg.style.top = y + "px";
            msg.style.color = "red";
            msg.style.fontWeight = "bold";
            msg.style.fontSize = "24px";
            msg.style.pointerEvents = "none";

            layer.appendChild(msg);
        }
    </script>
</body>
</html>
